# Full DE + ARL, 0.1% point annotations. Effective settings checked against the training log.
name: s3dis_sparse_0p1
dataset: s3dis
# Reproduced training seed; fixed sparse labels are supplied independently.
seed: 999
ignore_index: 255
data:
  # Run commands from SparseSBS/ (README.md directory), not from configs/.
  # Generated by prepare_data.py --dataset s3dis --output-root data/s3dis
  # This directory is NOT bundled. --data-root overrides it for train/evaluate.
  root: data/s3dis
  # Relative to data.root. prepare_data.py installs/creates indices using
  # assets/s3dis/anchors.pt after checking the prepared point ordering.
  anchors: anchors.pt
  # Relative to data.root; prepare_data.py copies assets/s3dis/dist{0,1}.pt here.
  statistics:
  - statistics/dist0.pt
  - statistics/dist1.pt
  options:
    sparse_ignore_index: 255
    sparse_train_only: true
    point_order_mode: spatial_voxel
    point_order_seed: 20260716
    point_order_voxel_size: 0.5
    pre_subsample_shuffle: false
    ks:
    - 24
    - 32
    - 32
    - 32
    grid_sizes:
    - 0.04
    - 0.08
    - 0.16
    - 0.32
    num_points: 30000
    anchor_retention: preserve
    area: '!5'
    loop: 30
model:
  num_classes: 13
  neighbors:
  - 24
  - 32
  - 32
  - 32
  depths:
  - 4
  - 4
  - 8
  - 8
  widths:
  - 64
  - 128
  - 256
  - 512
  head_dim: 256
  bn_momentum: 0.02
  mlp_ratio: 2
  drop_paths:
  - - 0.0
    - 0.004347826354205608
    - 0.008695652708411217
    - 0.013043479062616825
  - - 0.017391305416822433
    - 0.021739132702350616
    - 0.02608695812523365
    - 0.030434783548116684
  - - 0.03478261083364487
    - 0.03913043811917305
    - 0.04347826540470123
    - 0.04782608896493912
    - 0.052173912525177
    - 0.056521736085414886
    - 0.06086956337094307
    - 0.06521739065647125
  - - 0.06956521421670914
    - 0.07391304522752762
    - 0.0782608687877655
    - 0.08260869979858398
    - 0.08695652335882187
    - 0.09130434691905975
    - 0.09565217792987823
    - 0.10000000149011612
  head_drops:
  - 0.0
  - 0.05000000074505806
  - 0.10000000894069672
  - 0.15000000596046448
  coordinate_scales:
  - 1.6
  - 3.8
  - 7.6
  - 15.2
  input_mode: rgb
training:
  epochs: 100
  batch_size: 4
  workers: 8
  learning_rate: 0.006
  weight_decay: 0.05
  label_smoothing: 0.0
  class_weights: null
  warmup_epochs: 10
  coordinate_loss_scale: 0.25
  precision: bf16
  save_every: 10
  validation_interval: 1
  validation_batch_size: 1
  validation_loop: 1
  log_every_steps: 50
  bn_warmup_grid:
  - 0.04
  - 3.5
  - 3.5
  - 3.5
arl:
  prototype_scope: collated_batch
  local:
    start_epoch: 10
    score_threshold: 0.75
    margin: 0.1
    boundary_threshold: 0.55
    eligible_retention: 0.2
    loss_weight: 0.05
  global_confirmation:
    start_epoch: 30
    similarity_threshold: 0.8
    confidence_threshold: 0.0
    boundary_threshold: 0.65
    per_class_retention: 0.05
    min_anchors: 1
    loss_weight: 0.03
evaluation:
  protocol: area5
  rotations:
  - 0
  scales:
  - 1.0
  votes: 1
  max_points: 100000
