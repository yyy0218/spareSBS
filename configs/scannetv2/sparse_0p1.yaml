# Full DE + ARL, 0.1% point annotations. Effective settings checked against the training log.
name: scannetv2_sparse_0p1
dataset: scannetv2
# Reproduced training seed; fixed sparse labels are supplied independently.
seed: 42
ignore_index: -1
data:
  # Run commands from SparseSBS/ (README.md directory), not from configs/.
  # Generated by prepare_data.py --dataset scannetv2 --output-root data/scannetv2
  # This directory is NOT bundled. --data-root overrides it for train/evaluate.
  root: data/scannetv2
  # Relative to data.root. prepare_data.py installs/creates indices using
  # assets/scannetv2/anchors.pt after checking the prepared point ordering.
  anchors: anchors.pt
  # Relative to data.root; prepare_data.py copies assets/scannetv2/dist{0,1}.pt here.
  statistics:
  - statistics/dist0.pt
  - statistics/dist1.pt
  options:
    sparse_ignore_index: -1
    sparse_train_only: true
    ks:
    - 24
    - 32
    - 32
    - 32
    - 32
    grid_sizes:
    - 0.02
    - 0.04
    - 0.08
    - 0.16
    - 0.32
    max_pts: 80000
    anchor_retention: preserve
    loop: 6
model:
  num_classes: 20
  neighbors:
  - 24
  - 32
  - 32
  - 32
  - 32
  depths:
  - 4
  - 4
  - 4
  - 8
  - 8
  widths:
  - 80
  - 128
  - 192
  - 352
  - 640
  head_dim: 352
  bn_momentum: 0.02
  mlp_ratio: 2
  drop_paths:
  - - 0.0
    - 0.003703703870996833
    - 0.007407407741993666
    - 0.011111111380159855
  - - 0.014814815483987331
    - 0.018518518656492233
    - 0.02222222276031971
    - 0.025925926864147186
  - - 0.029629630967974663
    - 0.03333333507180214
    - 0.03703703731298447
    - 0.04074074327945709
  - - 0.04444444552063942
    - 0.048148151487112045
    - 0.051851850003004074
    - 0.0555555559694767
    - 0.05925925821065903
    - 0.06296296417713165
    - 0.06666667014360428
    - 0.07037036865949631
  - - 0.07407407462596893
    - 0.07777778059244156
    - 0.08148147910833359
    - 0.08518518507480621
    - 0.08888889104127884
    - 0.09259259700775146
    - 0.0962962955236435
    - 0.10000000149011612
  head_drops:
  - 0.0
  - 0.05000000074505806
  - 0.10000000149011612
  - 0.15000000596046448
  - 0.20000000298023224
  coordinate_scales:
  - 1.6
  - 3.0
  - 5.7
  - 11.2
  - 21.5
  input_mode: normal
training:
  epochs: 100
  batch_size: 2
  workers: 8
  learning_rate: 0.0015
  weight_decay: 0.05
  label_smoothing: 0.0
  class_weights: null
  warmup_epochs: 10
  coordinate_loss_scale: 0.2
  precision: bf16
  save_every: 10
  validation_interval: 1
  validation_batch_size: 1
  validation_loop: 1
  log_every_steps: 50
  bn_warmup_grid:
  - 0.02
  - 1.8
  - 3.5
  - 3.5
  - 4
arl:
  prototype_scope: collated_batch
  local:
    start_epoch: 10
    score_threshold: 0.75
    margin: 0.1
    boundary_threshold: 0.55
    eligible_retention: 0.2
    loss_weight: 0.05
  global_confirmation:
    start_epoch: 30
    similarity_threshold: 0.8
    confidence_threshold: 0.0
    boundary_threshold: 0.65
    per_class_retention: 0.05
    min_anchors: 1
    loss_weight: 0.03
evaluation:
  protocol: val
  rotations:
  - 0
  scales:
  - 1.0
  votes: 1
  max_points: 100000
